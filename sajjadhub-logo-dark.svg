<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="logoTitle logoDesc">
<title id="logoTitle">Sajjadhub</title>
<desc id="logoDesc">Sajjadhub Digital Design Store — two gently floating books beside the wordmark.</desc>
<defs>
  <linearGradient id="backCover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb45d"/><stop offset="1" stop-color="#e66a27"/></linearGradient>
  <linearGradient id="frontCover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e17a"/><stop offset="1" stop-color="#087b45"/></linearGradient>
  <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f2e8"/></linearGradient>
  <filter id="bookShadow" x="-35%" y="-25%" width="180%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .logo-book{transform-box:fill-box;transform-origin:center;transform-style:preserve-3d;filter:url(#bookShadow);will-change:transform}
  .logo-book-back{animation:logoBookBack 5.2s ease-in-out infinite}
  .logo-book-front{animation:logoBookFront 4.6s ease-in-out infinite}
  @keyframes logoBookBack{0%,100%{transform:perspective(520px) rotateX(5deg) rotateY(-15deg) rotate(-11deg) translateY(0)}50%{transform:perspective(520px) rotateX(5deg) rotateY(-15deg) rotate(-11deg) translateY(-11px)}}
  @keyframes logoBookFront{0%,100%{transform:perspective(520px) rotateX(-4deg) rotateY(13deg) rotate(8deg) translateY(0)}50%{transform:perspective(520px) rotateX(-4deg) rotateY(13deg) rotate(8deg) translateY(-14px)}}
  @media(prefers-reduced-motion:reduce){.logo-book{animation:none!important;will-change:auto}}
</style>
<g class="logo-book logo-book-back">
  <rect x="24" y="35" width="112" height="154" rx="10" fill="url(#backCover)"/>
  <path d="M39 49h82v123H39z" fill="url(#pages)"/>
  <path d="M48 64h62M48 76h62M48 88h49" fill="none" stroke="#d5a17b" stroke-width="3" stroke-linecap="round"/>
  <path d="M31 42v139" stroke="#b94f20" stroke-width="5" stroke-linecap="round"/>
  <path d="M39 172h82" stroke="#d7dfd4" stroke-width="2"/>
</g>
<g class="logo-book logo-book-front">
  <rect x="78" y="42" width="112" height="154" rx="10" fill="url(#frontCover)"/>
  <path d="M93 56h82v123H93z" fill="url(#pages)"/>
  <path d="M103 73h62M103 86h62M103 99h48" fill="none" stroke="#8cae8e" stroke-width="3" stroke-linecap="round"/>
  <path d="M85 49v139" stroke="#087b45" stroke-width="5" stroke-linecap="round"/>
  <path d="M93 179h82" stroke="#d7dfd4" stroke-width="2"/>
  <path d="M128 124l8 8 17-19" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="225" y="127" font-family="Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-5" fill="#f1f7f2">Sajjad</text>
<text x="528" y="127" font-family="Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-5" fill="#73e69b">hub</text>
<path d="M226 151h510" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
<text x="229" y="190" font-family="Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#b5cdbd">DIGITAL DESIGN STORE</text>
</svg>
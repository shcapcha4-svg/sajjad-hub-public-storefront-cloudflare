<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="logoTitle logoDesc">
<title id="logoTitle">Sajjadhub</title>
<desc id="logoDesc">Sajjadhub shopping bag mark with the letter S and DIGITAL DESIGN STORE wordmark.</desc>
<defs>
  <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62f28a"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
  <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff8a00"/><stop offset="1" stop-color="#ffc52e"/></linearGradient>
  <linearGradient id="bagSide" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087b45"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
  <filter id="markShadow" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .brand-mark{transform-box:fill-box;transform-origin:center;filter:url(#markShadow);animation:brandFloat 4.8s ease-in-out infinite;will-change:transform}
  @keyframes brandFloat{0%,100%{transform:perspective(520px) rotateY(-5deg) rotateX(1deg) translateY(0)}50%{transform:perspective(520px) rotateY(5deg) rotateX(-1deg) translateY(-6px)}}
  @media(prefers-reduced-motion:reduce){.brand-mark{animation:none!important;will-change:auto}}
</style>
<g class="brand-mark" transform="translate(14 14)">
  <path d="M44 65V48a48 48 0 0 1 96 0v17" fill="none" stroke="#16a34a" stroke-width="13" stroke-linecap="round"/>
  <rect x="20" y="62" width="145" height="133" rx="24" fill="url(#bag)"/>
  <path d="M153 76v93a24 24 0 0 1-24 24h12a24 24 0 0 0 24-24V86z" fill="url(#bagSide)" opacity=".38"/>
  <path d="M121 91c-25-26-72-12-72 18 0 20 24 29 48 41 21 11 25 27 8 39-18 13-48 4-63-12 17 32 67 43 91 14 25-31 1-51-28-66-20-10-34-18-25-29 8-10 26-9 41 0z" fill="#fff"/>
  <path d="M15 173c43 36 128 32 174-7" fill="none" stroke="url(#swoosh)" stroke-width="11" stroke-linecap="round"/>
  <path d="M131 46c13-20 30-24 45-20-4 19-17 31-38 31" fill="#8be34c"/>
</g>
<text x="225" y="127" font-family="Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-5" fill="#f8fafc">Sajjad</text>
<text x="528" y="127" font-family="Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-5" fill="#4ade80">hub</text>
<path d="M226 151h510" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
<text x="229" y="190" font-family="Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#cbd5e1">DIGITAL DESIGN STORE</text>
</svg>
<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sajjadhub Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>
body{background:#f4f6f2}.admin-wrap{max-width:1100px;margin:35px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.admin-panel,.admin-login,.admin-card{background:#fff;border:1px solid #e6eae2;border-radius:14px;padding:22px;margin-bottom:18px}.admin-login{max-width:430px;margin:9vh auto}.admin-login input,.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:11px;border:1px solid #d8ded4;border-radius:7px;margin:6px 0 14px}.admin-form label{font-weight:600;font-size:13px}.admin-form textarea{min-height:80px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-btn{border:0;background:#101828;color:white;padding:10px 15px;border-radius:7px;cursor:pointer;font-weight:700}.admin-btn.light{background:#eaf2df;color:#3d5e1a}.admin-btn.danger{background:#a83232}.admin-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.admin-item{border:1px solid #e5e9e2;border-radius:10px;padding:13px}.admin-item img{width:100%;height:125px;object-fit:contain;background:#f2f4ef;border-radius:7px}.admin-item h3{margin:8px 0}.admin-actions{display:flex;gap:7px;flex-wrap:wrap}.admin-message{color:#54751d;font-weight:600;min-height:24px}.order-row{border-top:1px solid #edf0eb;padding:15px 0}.order-row p{margin:4px 0;color:#667085;font-size:13px}.status{font-weight:700}.status.paid{color:#387a27}.status.pending{color:#a56a11}.status.rejected{color:#a83232}.download-list a{display:inline-block;margin:5px 8px 0 0;color:#386b9b;text-decoration:underline}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="admin-wrap"><div id="loginView" class="admin-login"><a class="brand" href="/"><span class="brand-mark">S</span><span>Sajjad<span class="brand-light">hub</span><small>ADMIN PANEL</small></span></a><h2>অ্যাডমিন লগইন</h2><p>শুধু সাইট পরিচালকের জন্য।</p><form id="loginForm"><label>অ্যাডমিন পাসওয়ার্ড<input id="password" type="password" required autocomplete="current-password"></label><button class="admin-btn" type="submit">লগইন করুন</button></form><p id="loginMessage" class="admin-message"></p></div><div id="dashboard" hidden><div class="admin-head"><div><a class="brand" href="/"><span class="brand-mark">S</span><span>Sajjad<span class="brand-light">hub</span><small>ADMIN PANEL</small></span></a><h1>ড্যাশবোর্ড</h1></div><button id="logout" class="admin-btn danger">লগআউট</button></div><div class="admin-panel"><h2 id="formTitle">নতুন ডিজাইন আপলোড</h2><form id="productForm" class="admin-form"><input id="productId" type="hidden"><div class="admin-grid"><label>ডিজাইনের নাম<input name="name" required></label><label>ক্যাটাগরি<select name="category"><option>পোস্টার</option><option>ব্যানার</option><option>সোশ্যাল মিডিয়া</option><option>লোগো</option><option>অন্যান্য</option></select></label><label>দাম (৳)<input name="price" type="number" min="0" required></label><label>ট্যাগ<input name="tag" placeholder="NEW / BEST SELLER"></label></div><label>বিবরণ<textarea name="description"></textarea></label><div class="admin-grid"><label>ফাইল ফরম্যাট<input name="fileType" placeholder="PDF, PNG, PSD, AI..."></label><label>প্রিভিউ ছবি (সর্বোচ্চ ৮ MB)<input name="image" type="file" accept="image/*"></label></div><label>ক্রেতার ডাউনলোড ফাইল (সর্বোচ্চ ৫০ MB)<input name="file" type="file"></label><div class="admin-actions"><button class="admin-btn" type="submit">সংরক্ষণ করুন</button><button id="cancelEdit" class="admin-btn light" type="button" hidden>এডিট বাতিল</button></div><p id="productMessage" class="admin-message"></p></form></div><div class="admin-panel"><h2>আপনার ডিজাইনসমূহ</h2><div id="products" class="admin-list"></div></div><div class="admin-panel"><h2>অর্ডার ও পেমেন্ট</h2><p>TrxID ও Nagad লেনদেন নিজে যাচাই করে তারপর Paid করুন।</p><div id="orders"></div></div></div></div><script src="admin.js"></script></body></html>
